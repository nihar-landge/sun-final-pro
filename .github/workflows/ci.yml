name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & test
        working-directory: backend
        env:
          # Enables the Testcontainers-based integration tests (CI's Docker
          # Engine has no client-version restrictions).
          TEST_DOCKER: 'true'
        run: ./mvnw -B verify

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/

  mobile:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze & test (mobile)
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Analyze (admin)
        working-directory: admin
        run: |
          flutter pub get
          flutter analyze
