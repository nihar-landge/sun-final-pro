name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  services:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & test
        working-directory: services
        env:
          # Enables the Testcontainers-based integration tests (CI's Docker
          # Engine has no client-version restrictions).
          TEST_DOCKER: 'true'
        run: ./mvnw -B verify

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-test-reports
          path: services/**/target/surefire-reports/

  mobile:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze & test (citizen app)
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

  react-admin:
    name: React admin test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-react/package-lock.json

      - name: Test & build
        working-directory: admin-react
        run: |
          npm ci
          npm test
          npm run build

  email-service:
    name: Email service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: email-service/package-lock.json

      - name: Install & test
        working-directory: email-service
        run: |
          npm install
          npm test
