name: e2e

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  e2e:
    name: End-to-end guarantee checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build service jars
        working-directory: services
        run: ./mvnw -B -DskipTests package

      - name: Start the full stack (compose)
        run: docker compose up -d --build

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 localhost:8080/actuator/health || true)
            [ "$code" = "200" ] && echo "gateway healthy" && exit 0
            sleep 5
          done
          echo "gateway not healthy after 300s"; docker compose ps; exit 1

      - name: Run E2E guarantee checks
        run: scripts/e2e.sh localhost:8080

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 100
