name: e2e

# Push trigger parked during the architecture-simplification rework;
# restored (with the compose-based job) once the core gate passes.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end guarantee checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start infrastructure (PostgreSQL+PostGIS, Redis, SeaweedFS, RabbitMQ)
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Build services
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Start all services
        working-directory: backend
        run: |
          for svc in auth-service poll-service feedback-service notification-service api-gateway; do
            nohup java -jar $svc/target/$svc-0.1.0-SNAPSHOT.jar > /tmp/$svc.log 2>&1 &
          done
          for i in $(seq 1 60); do
            ok=true
            for port in 8080 8081 8082 8083 8084; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 localhost:$port/actuator/health || true)
              [ "$code" = "200" ] || ok=false
            done
            $ok && break
            sleep 2
          done
          if ! $ok; then
            echo "Not all services healthy after 120s:"
            for port in 8080 8081 8082 8083 8084; do
              echo "  :$port -> $(curl -s -o /dev/null -w '%{http_code}' -m 2 localhost:$port/actuator/health || true)"
            done
            tail -n 50 /tmp/*.log || true
            exit 1
          fi

      - name: Run E2E guarantee checks
        run: scripts/e2e.sh localhost:8080

      - name: Dump service logs on failure
        if: failure()
        run: tail -n 50 /tmp/*.log || true
