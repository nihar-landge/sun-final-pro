server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/authdb?serverTimezone=UTC
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:mysql_feedback_pw}

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-1234567890}
    issuer: feedbackapp-auth
    access-ttl: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.feedbackapp: DEBUG
