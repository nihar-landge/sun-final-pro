server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: poll-service
          uri: ${POLL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/polls/**
        - id: feedback-service
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/feedback/**
        - id: feedback-uploads
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/uploads/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-1234567890}
    issuer: feedbackapp-auth

logging:
  level:
    com.example.feedbackapp: DEBUG
