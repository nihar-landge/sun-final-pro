server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/notificationdb?serverTimezone=UTC
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:mysql_feedback_pw}

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true               # this service owns notificationdb

app:
  internal:
    service-key: ${SERVICE_KEY:dev-service-key}

  email-service:
    base-url: ${EMAIL_SERVICE_URL:http://localhost:8090}
    service-key: ${SERVICE_KEY:dev-service-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
