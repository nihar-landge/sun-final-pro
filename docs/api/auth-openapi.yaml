openapi: 3.0.3
info:
  title: Auth Service API
  version: 0.1.0
  description: >
    Phone OTP authentication with JWT access tokens and rotating refresh
    tokens. All responses use the ApiResponse envelope
    {success, data, message, timestamp}.
servers:
  - url: http://localhost:8081/api/v1
  - url: http://localhost:8080/api/v1
paths:
  /auth/otp/send:
    post:
      tags: [Authentication]
      summary: Send a login OTP to the given phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^\d{10,15}$'
                  example: "9876543210"
      responses:
        '200':
          description: OTP dispatched (devOtp present only when dev-echo enabled)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      phone: { type: string }
                      expiresInSeconds: { type: integer }
                      devOtp:
                        type: string
                        nullable: true
                        example: "123456"
        '429':
          description: Cooldown active — retry after sendCooldown
  /auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify the OTP and receive a token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "9876543210" }
                code: { type: string, example: "123456" }
                name:
                  type: string
                  nullable: true
                  description: Only used when registering a new user
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Wrong or expired OTP
        '429':
          description: Too many failed attempts — OTP revoked
  /auth/token/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new pair (rotation revokes the old one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unknown or already-rotated refresh token
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Revoked
  /auth/me:
    get:
      tags: [Authentication]
      summary: Profile of the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Missing/invalid token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        phone: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [CITIZEN, MODERATOR, ADMIN]
    TokenResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            tokenType: { type: string, example: Bearer }
            expiresIn: { type: integer, description: Access token TTL in seconds }
            user:
              $ref: '#/components/schemas/User'
