name: feedbackapp

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  grafana_data:

services:
  mysql:
    image: mysql:8.4
    container_name: feedbackapp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_devpw
      MYSQL_DATABASE: authdb
      MYSQL_USER: feedback
      MYSQL_PASSWORD: mysql_feedback_pw
    ports:
      # 3307 on the host: a local (Homebrew) MySQL can occupy 127.0.0.1:3306
      # and shadow the container for host-run services. Container-side tools
      # and Kubernetes (host.docker.internal) are unaffected by this mapping.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql_root_devpw"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [app-net]

  redis:
    image: redis:7-alpine
    container_name: feedbackapp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-net]

  storage:
    image: chrislusf/seaweedfs:3.80
    container_name: feedbackapp-storage
    # S3-compatible object storage (MinIO pulled its public images; SeaweedFS
    # speaks the same S3 API and works with the MinIO Java client).
    command: >
      server -dir=/data -master.volumeSizeLimitMB=1024
      -ip=storage -master.port=9333 -volume.port=8080
      -s3 -s3.port=9000
    ports:
      - "9000:9000"   # S3 API
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [app-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: feedbackapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app-net]

  grafana:
    image: grafana/grafana:latest
    container_name: feedbackapp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin        # dev-only credentials
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on: [prometheus]
    networks: [app-net]

