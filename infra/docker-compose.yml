name: feedbackapp

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
  rabbitmq_data:
  grafana_data:

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: feedbackapp-postgres
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback_dev_password
      POSTGRES_DB: authdb          # default db; polldb + feedbackdb created by init script
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-net]

  redis:
    image: redis:7-alpine
    container_name: feedbackapp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-net]

  storage:
    image: chrislusf/seaweedfs:3.80
    container_name: feedbackapp-storage
    # S3-compatible object storage (MinIO pulled its public images; SeaweedFS
    # speaks the same S3 API and works with the MinIO Java client).
    command: >
      server -dir=/data -master.volumeSizeLimitMB=1024
      -ip=storage -master.port=9333 -volume.port=8080
      -s3 -s3.port=9000
    ports:
      - "9000:9000"   # S3 API
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [app-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: feedbackapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app-net]

  grafana:
    image: grafana/grafana:latest
    container_name: feedbackapp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin        # dev-only credentials
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on: [prometheus]
    networks: [app-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: feedbackapp-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [app-net]
