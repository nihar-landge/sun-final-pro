{{- $fullname := include "civicpulse.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "civicpulse.labels" (dict "name" "secrets" "Release" .Release "Values" .Values) | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
  SERVICE_KEY: {{ .Values.serviceKey | quote }}
  {{- if .Values.mysql.enabled }}
  DB_USER: {{ .Values.mysql.user | quote }}
  DB_PASSWORD: {{ .Values.mysql.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  {{- else }}
  DB_USER: {{ .Values.externalDatabase.user | quote }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
