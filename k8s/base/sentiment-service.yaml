apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-service
  namespace: feedbackapp
  labels: { app: sentiment-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: sentiment-service }
  template:
    metadata:
      labels: { app: sentiment-service }
    spec:
      containers:
        - name: sentiment-service
          image: civicpulse/sentiment-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef: { name: feedbackapp-config }
            - secretRef: { name: feedbackapp-secrets }
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0"
          startupProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            periodSeconds: 5
            failureThreshold: 60          # up to 5 min for slow JVM boot under load
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8085 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  namespace: feedbackapp
spec:
  selector: { app: sentiment-service }
  ports:
    - port: 8085
      targetPort: 8085
---

