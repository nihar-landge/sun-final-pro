# App services run in Kubernetes; the stateful data layer (MySQL) stays in
# the local Docker Compose stack and is reached via host.docker.internal.
# In a real deployment it becomes an in-cluster StatefulSet or a managed
# cloud database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: feedbackapp-config
  namespace: feedbackapp
data:
  DB_HOST: "host.docker.internal"
  DB_PORT: "3306"
  # Service-to-service URLs (cluster-internal DNS). The gateway is the only
  # externally exposed backend; these are reachable only in-cluster.
  AUTH_SERVICE_URL: "http://auth-service.feedbackapp.svc.cluster.local:8081"
  POLL_SERVICE_URL: "http://poll-service.feedbackapp.svc.cluster.local:8082"
  FEEDBACK_SERVICE_URL: "http://feedback-service.feedbackapp.svc.cluster.local:8083"
  NOTIFICATION_SERVICE_URL: "http://notification-service.feedbackapp.svc.cluster.local:8084"
  NOTIFICATION_URL: "http://notification-service.feedbackapp.svc.cluster.local:8084"
  EMAIL_URL: "http://email-service.feedbackapp.svc.cluster.local:8090"
  UPLOAD_DIR: "/app/uploads"
