server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/authdb
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:feedback_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-1234567890}
    issuer: feedbackapp-auth
    access-ttl: 15m
    refresh-ttl: 30d
  otp:
    length: 6
    ttl: 5m
    dev-echo: ${OTP_DEV_ECHO:true}   # NEVER true in production
    max-verify-attempts: 5
    send-cooldown: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.feedbackapp: DEBUG
