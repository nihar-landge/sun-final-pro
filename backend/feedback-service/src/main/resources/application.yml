server:
  port: 8083

spring:
  application:
    name: feedback-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/feedbackdb?serverTimezone=UTC
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:mysql_feedback_pw}

  jpa:
    hibernate:
      ddl-auto: none     # Flyway owns the schema; validate false-positives on spatial columns
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 6MB      # service-level limit is 5 MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
