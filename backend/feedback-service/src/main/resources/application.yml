server:
  port: 8083

spring:
  application:
    name: feedback-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/feedbackdb
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:feedback_dev_password}

  jpa:
    hibernate:
      ddl-auto: none     # Flyway owns the schema; validate false-positives on geography columns
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

minio:
  enabled: ${MINIO_ENABLED:true}
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:feedback-photos}
  region: ${MINIO_REGION:us-east-1}   # "auto" for Cloudflare R2
