server:
  port: 8082

spring:
  application:
    name: poll-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/polldb?serverTimezone=UTC
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:mysql_feedback_pw}

  jpa:
    hibernate:
      ddl-auto: none     # Flyway owns the schema
    open-in-view: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
