server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/feedbackdb?serverTimezone=UTC
    username: ${DB_USER:feedback}
    password: ${DB_PASSWORD:mysql_feedback_pw}

  flyway:
    enabled: false     # feedback-service owns and migrates the shared tables

fcm:
  enabled: true
  # Service-account JSON from Firebase console > Project settings >
  # Service accounts > Generate new private key. Push is disabled (and the
  # poller marks rows attempted) when the file is absent.
  service-account: ${FCM_SERVICE_ACCOUNT:}
  project-id: ${FCM_PROJECT_ID:feedback-5c79b}

poll:
  interval-ms: ${PUSH_POLL_INTERVAL_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
